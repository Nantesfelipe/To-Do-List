        <section class="secao-categorias">

            <h3>Categorias</h3>

            <ul>

                </li>

                <li>
                    <span>Pessoal</span>

                <li>

    <main class="container-principal">

        <header class="cabecalho">

        <form class="formulario-tarefa" id="formulario-tarefa">

            <div class="adcionar-tarefa">
                <h2>Adicionar nova tarefa</h2>
                <small id="mensagemErro"></small>
            </div>



            <div class="grupo-formulario">

                <input type="text" id="inputTarefa" placeholder="O que precisa ser feito?">


                <input type="date" id="inputData">

                <input type="time" id="inputHora">

                <select id="inputCategoria">

                    <option value="" disabled selected>
                        Categoria
                    </option>

                    <option value="Trabalho">
                        Trabalho
                    </option>

                    <option value="Estudos">
                        Estudos
                    </option>

                    <option value="Saúde">
                        Saúde
                    </option>

                    <option value="Pessoal">
                        Pessoal
                    </option>

                </select>

                <button type="submit" id="botaoAdicionar">
                    Adicionar
                </button>


            </div>

        </form>




        <section class="secao-tarefas">

            <div class="cabecalho-tarefas">

                </span>
