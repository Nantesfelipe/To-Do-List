<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/pages/register.css">
    <link rel="icon" href="/img/Login.png">
    <title>Registrar</title>
</head>

<body>

    <div class="container">
        <form id="formRegister">
            <h1>Registre-se !</h1>

            <div class="input-group">
                <Label for="emailRegister">Digite seu Email!
                    <input type="email" name="emailRegister" id="emailRegister" placeholder="Digite seu email!">
                </Label>
            </div>

            <div class="input-group">
                <Label for="passwordRegister">Digite sua Senha!
                    <input type="password" name="passwordRegister" id="passwordRegister"
                        placeholder="Digite sua senha!">
                </Label>
            </div>

            <p id="mensagemDeSucesso" style="color: green;"></p>
            <br>
            <p id="mensagemDeErro" style="color: red; margin-bottom: 5px; text-align: center;"></p>
            <button type="submit">Enviar!</button>
 

        </form>
    </div>

    <script src="/js/auth/register.js"></script>
</body>

</html>
