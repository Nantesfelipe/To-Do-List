<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/pages/login.css">
    <link rel="icon" href="/img/Login.png">
    <title>Login</title>
</head>

<body>
    <main>

        <div id="formLogin" class="container">
            <form class="login-form">
                <h1>Realize seu Login!</h1>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="Digite seu email">
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" name="senha" placeholder="Digite sua senha">
                </div>

                <button id="botaoEntrar" type="submit">Entrar</button>

            </form>

            <p>Não tem uma conta?
                <a href="/pages/register.html">Cadastre-se!</a>
            </p>
        </div>


    </main>


    <script src="/js/auth/login.js"></script>
</body>

</html>
